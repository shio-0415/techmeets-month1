<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0ece4;
      --card: #ffffff;
      --accent: #c8703a;
      --accent-light: #f5e6d8;
      --text: #2a2118;
      --muted: #9a8e82;
      --done: #c4bdb5;
      --shadow: 0 4px 24px rgba(80,50,20,0.10);
      --radius: 16px;
    }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px 80px;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    header {
      margin-bottom: 36px;
      text-align: left;
    }

    header .label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 4px;
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 42px;
      color: var(--text);
      line-height: 1.1;
      font-style: italic;
    }

    header h1 span {
      font-style: normal;
      color: var(--accent);
    }

    .input-area {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      padding: 8px 8px 8px 20px;
      gap: 10px;
      margin-bottom: 28px;
      transition: box-shadow 0.2s;
    }

    .input-area:focus-within {
      box-shadow: 0 4px 32px rgba(200,112,58,0.18), var(--shadow);
    }

    .input-area input {
      flex: 1;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: transparent;
      padding: 8px 0;
    }

    .input-area input::placeholder {
      color: var(--done);
    }

    .input-area button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      width: 44px;
      height: 44px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
      line-height: 1;
    }

    .input-area button:hover { background: #b35c28; }
    .input-area button:active { transform: scale(0.94); }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat .num {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      color: var(--text);
      line-height: 1;
    }

    .stat .lbl {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    .divider {
      width: 1px;
      height: 36px;
      background: var(--done);
      opacity: 0.5;
      align-self: center;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      padding: 16px 14px 16px 20px;
      gap: 14px;
      cursor: pointer;
      transition: box-shadow 0.18s, transform 0.15s, opacity 0.2s;
      animation: slideIn 0.25s cubic-bezier(.22,1,.36,1);
      user-select: none;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover {
      box-shadow: 0 6px 32px rgba(80,50,20,0.13);
      transform: translateY(-1px);
    }

    .task-item.done {
      opacity: 0.65;
    }

    .check-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--done);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }

    .task-item.done .check-circle {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .check-icon {
      display: none;
      width: 12px;
      height: 12px;
      stroke: var(--accent);
      stroke-width: 2.5;
      fill: none;
    }

    .task-item.done .check-icon { display: block; }

    .task-text {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      line-height: 1.5;
      transition: color 0.15s;
      word-break: break-all;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--done);
      text-decoration-color: var(--done);
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--done);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #c0392b;
      background: #fdecea;
    }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--muted);
      font-size: 14px;
      display: none;
    }

    .empty-state .emoji { font-size: 36px; display: block; margin-bottom: 12px; }

    .task-list:empty + .empty-state { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="label">My Tasks</div>
      <h1>今日の<span>やること</span></h1>
    </header>

    <div class="input-area">
      <input type="text" id="task-input" placeholder="新しいタスクを入力…" autocomplete="off">
      <button id="add-btn" aria-label="追加">+</button>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="num" id="stat-total">0</span>
        <span class="lbl">タスク</span>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <span class="num" id="stat-done">0</span>
        <span class="lbl">完了</span>
      </div>
    </div>

    <ul class="task-list" id="task-list"></ul>
    <div class="empty-state">
      <span class="emoji">✨</span>
      タスクがありません。<br>何か追加してみましょう！
    </div>
  </div>

  <script>
    let tasks = [];
    let nextId = 1;

    const input     = document.getElementById('task-input');
    const addBtn    = document.getElementById('add-btn');
    const listEl    = document.getElementById('task-list');
    const statTotal = document.getElementById('stat-total');
    const statDone  = document.getElementById('stat-done');

    function render() {
      listEl.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;

        li.innerHTML = `
          <div class="check-circle">
            <svg class="check-icon" viewBox="0 0 12 10">
              <polyline points="1.5,5 4.5,8.5 10.5,1.5"/>
            </svg>
          </div>
          <span class="task-text"></span>
          <button class="delete-btn" aria-label="削除" title="削除">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="2" y1="2" x2="12" y2="12"/>
              <line x1="12" y1="2" x2="2" y2="12"/>
            </svg>
          </button>
        `;
        li.querySelector('.task-text').textContent = task.text; // ← textContent で安全に設定

        li.addEventListener('click', e => {
          if (!e.target.closest('.delete-btn')) toggleDone(task.id);
        });

        li.querySelector('.delete-btn').addEventListener('click', e => {
          e.stopPropagation();
          deleteTask(task.id);
        });

        listEl.appendChild(li);
      });

      statTotal.textContent = tasks.length;
      statDone.textContent  = tasks.filter(t => t.done).length;
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      tasks.push({ id: nextId++, text, done: false });
      input.value = '';
      input.focus();
      render();
    }

    function toggleDone(id) {
      const t = tasks.find(t => t.id === id);
      if (t) { t.done = !t.done; render(); }
    }

    function deleteTask(id) {
      const idx = tasks.findIndex(t => t.id === id);
      if (idx !== -1) {
        const li = listEl.querySelector(`[data-id="${id}"]`);
        if (li) {
          li.style.transition = 'opacity 0.2s, transform 0.2s';
          li.style.opacity = '0';
          li.style.transform = 'translateX(20px)';
          setTimeout(() => {
            tasks.splice(idx, 1);
            render();
          }, 200);
        } else {
          tasks.splice(idx, 1);
          render();
        }
      }
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    render();
  </script>
</body>
</html>
