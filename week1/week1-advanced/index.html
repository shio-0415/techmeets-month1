<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo - Advanced</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-light: #312e81;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --done: #475569;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius: 14px;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px 80px;
      color: var(--text);
    }

    .container { width: 100%; max-width: 500px; }

    header { margin-bottom: 32px; }

    header .label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }

    header h1 span { color: var(--accent); }

    .input-area {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      padding: 8px 8px 8px 18px;
      gap: 10px;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }

    .input-area:focus-within { border-color: var(--accent); }

    .input-area input {
      flex: 1;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: transparent;
      padding: 8px 0;
    }

    .input-area input::placeholder { color: var(--done); }

    .input-area button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      width: 42px;
      height: 42px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .input-area button:hover { background: #4f46e5; }
    .input-area button:active { transform: scale(0.93); }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      flex: 1;
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-card .num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .stat-card.accent-card .num { color: var(--accent); }

    .stat-card .lbl {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .hint {
      font-size: 12px;
      color: var(--done);
      margin-bottom: 14px;
      padding-left: 4px;
    }

    .hint span { color: var(--accent); }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      padding: 14px 12px 14px 16px;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.18s, transform 0.15s;
      animation: slideIn 0.22s cubic-bezier(.22,1,.36,1);
      user-select: none;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover { border-color: var(--accent); transform: translateY(-1px); }
    .task-item.done { opacity: 0.5; }
    .task-item.editing-mode { cursor: default; border-color: var(--accent); }

    .check-circle {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--done);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }

    .task-item.done .check-circle {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .check-icon {
      display: none;
      width: 11px;
      height: 11px;
      stroke: #a5b4fc;
      stroke-width: 2.5;
      fill: none;
    }

    .task-item.done .check-icon { display: block; }

    .task-text {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      line-height: 1.5;
      word-break: break-all;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--done);
    }

    .edit-input {
      flex: 1;
      border: none;
      border-bottom: 2px solid var(--accent);
      outline: none;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: transparent;
      padding: 2px 0;
      display: none;
    }

    .task-item.editing-mode .edit-input { display: block; }
    .task-item.editing-mode .task-text  { display: none; }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--done);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #f87171; background: rgba(248,113,113,0.1); }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--muted);
      font-size: 14px;
      display: none;
    }

    .empty-state .emoji { font-size: 36px; display: block; margin-bottom: 12px; }
    .task-list:empty + .empty-state { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="label">Advanced ToDo</div>
      <h1>タスク<span>管理</span></h1>
    </header>

    <div class="input-area">
      <input type="text" id="task-input" placeholder="新しいタスクを入力…" autocomplete="off">
      <button id="add-btn" aria-label="追加">+</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <span class="num" id="stat-total">0</span>
        <span class="lbl">総タスク数</span>
      </div>
      <div class="stat-card accent-card">
        <span class="num" id="stat-done">0</span>
        <span class="lbl">完了</span>
      </div>
      <div class="stat-card">
        <span class="num" id="stat-remaining">0</span>
        <span class="lbl">残り</span>
      </div>
    </div>

    <p class="hint"><span>ダブルクリック</span>でタスクを編集できます</p>

    <ul class="task-list" id="task-list"></ul>
    <div class="empty-state">
      <span class="emoji">🚀</span>
      タスクがありません。<br>何か追加してみましょう！
    </div>
  </div>

  <script>
    let tasks = [];
    let nextId = 1;

    const input         = document.getElementById('task-input');
    const addBtn        = document.getElementById('add-btn');
    const listEl        = document.getElementById('task-list');
    const statTotal     = document.getElementById('stat-total');
    const statDone      = document.getElementById('stat-done');
    const statRemaining = document.getElementById('stat-remaining');

    function render() {
      listEl.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;

        li.innerHTML = `
          <div class="check-circle">
            <svg class="check-icon" viewBox="0 0 12 10">
              <polyline points="1.5,5 4.5,8.5 10.5,1.5"/>
            </svg>
          </div>
          <span class="task-text"></span>
          <input class="edit-input" type="text">
          <button class="delete-btn" aria-label="削除" title="削除">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="2" y1="2" x2="12" y2="12"/>
              <line x1="12" y1="2" x2="2" y2="12"/>
            </svg>
          </button>
        `;

        const taskTextEl = li.querySelector('.task-text');
        const editInput  = li.querySelector('.edit-input');
        taskTextEl.textContent = task.text;

        // シングルクリックで完了トグル
        li.addEventListener('click', e => {
          if (!e.target.closest('.delete-btn') && !li.classList.contains('editing-mode')) {
            toggleDone(task.id);
          }
        });

        // ダブルクリックで編集モード
        taskTextEl.addEventListener('dblclick', e => {
          e.stopPropagation();
          li.classList.add('editing-mode');
          editInput.value = task.text;
          editInput.focus();
          editInput.select();
        });

        // 編集確定
        const commitEdit = () => {
          const newText = editInput.value.trim();
          if (newText) task.text = newText;
          li.classList.remove('editing-mode');
          taskTextEl.textContent = task.text;
        };

        editInput.addEventListener('keydown', e => {
          if (e.key === 'Enter')  { e.preventDefault(); commitEdit(); }
          if (e.key === 'Escape') { li.classList.remove('editing-mode'); taskTextEl.textContent = task.text; }
        });
        editInput.addEventListener('blur', commitEdit);
        editInput.addEventListener('click', e => e.stopPropagation());

        li.querySelector('.delete-btn').addEventListener('click', e => {
          e.stopPropagation();
          deleteTask(task.id);
        });

        listEl.appendChild(li);
      });

      const doneCount = tasks.filter(t => t.done).length;
      statTotal.textContent     = tasks.length;
      statDone.textContent      = doneCount;
      statRemaining.textContent = tasks.length - doneCount;
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      tasks.push({ id: nextId++, text, done: false });
      input.value = '';
      input.focus();
      render();
    }

    function toggleDone(id) {
      const t = tasks.find(t => t.id === id);
      if (t) { t.done = !t.done; render(); }
    }

    function deleteTask(id) {
      const idx = tasks.findIndex(t => t.id === id);
      if (idx !== -1) {
        const li = listEl.querySelector(`[data-id="${id}"]`);
        if (li) {
          li.style.transition = 'opacity 0.2s, transform 0.2s';
          li.style.opacity = '0';
          li.style.transform = 'translateX(20px)';
          setTimeout(() => { tasks.splice(idx, 1); render(); }, 200);
        } else {
          tasks.splice(idx, 1);
          render();
        }
      }
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    render();
  </script>
</body>
</html>
