<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slideshow</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0e0e0e;
      --surface: #1a1a1a;
      --border:  #2e2e2e;
      --accent:  #e8d5b0;
      --muted:   #555;
      --white:   #f5f0e8;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 2rem;
    }

    /* ── header ── */
    .header {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .counter {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ── stage ── */
    .stage {
      width: 100%;
      max-width: 700px;
      aspect-ratio: 2 / 1;
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    /* thin accent bar on top */
    .stage::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      z-index: 10;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateX(60px);
      transition: opacity 0.45s cubic-bezier(.4,0,.2,1),
                  transform 0.45s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .slide.exit {
      opacity: 0;
      transform: translateX(-60px);
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(20%) contrast(1.05);
    }

    /* caption */
    .slide-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.6rem 1rem;
      background: rgba(14,14,14,0.75);
      backdrop-filter: blur(4px);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ── controls ── */
    .controls {
      width: 100%;
      max-width: 700px;
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--white);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.65rem 1.5rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    .btn:active { opacity: 0.7; }
    .btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .btn:disabled:hover {
      background: transparent;
      border-color: var(--border);
      color: var(--white);
    }

    /* progress bar */
    .progress-track {
      flex: 1;
      height: 1px;
      background: var(--border);
      position: relative;
    }
    .progress-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      background: var(--accent);
      transition: width 0.45s cubic-bezier(.4,0,.2,1);
    }

    /* dots */
    .dots {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    .dot {
      width: 6px; height: 6px;
      border: 1px solid var(--muted);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .dot.active {
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Slideshow</h1>
    <span class="counter" id="counter">01 / 05</span>
  </div>

  <div class="stage" id="stage">
    <!-- slides injected by JS -->
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn">← Prev</button>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="dots" id="dots"></div>
    <button class="btn" id="nextBtn">Next →</button>
  </div>

  <script>
    const slides = [
      { src: 'https://placehold.jp/600x300.png', caption: 'Slide 01 — Placeholder Image' },
      { src: 'https://placehold.jp/3d4070/ffffff/600x300.png?text=Slide+02', caption: 'Slide 02 — Placeholder Image' },
      { src: 'https://placehold.jp/704040/ffffff/600x300.png?text=Slide+03', caption: 'Slide 03 — Placeholder Image' },
      { src: 'https://placehold.jp/407050/ffffff/600x300.png?text=Slide+04', caption: 'Slide 04 — Placeholder Image' },
      { src: 'https://placehold.jp/606060/ffffff/600x300.png?text=Slide+05', caption: 'Slide 05 — Placeholder Image' },
    ];

    let current = 0;
    let transitioning = false;

    const stage        = document.getElementById('stage');
    const prevBtn      = document.getElementById('prevBtn');
    const nextBtn      = document.getElementById('nextBtn');
    const counter      = document.getElementById('counter');
    const progressFill = document.getElementById('progressFill');
    const dotsWrap     = document.getElementById('dots');

    // スライドを動的生成
    slides.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'slide' + (i === 0 ? ' active' : '');
      div.dataset.index = i;

      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption;
      img.loading = 'lazy';

      const cap = document.createElement('div');
      cap.className = 'slide-caption';
      cap.textContent = s.caption;

      div.appendChild(img);
      div.appendChild(cap);
      stage.appendChild(div);
    });

    // ドットを動的生成
    slides.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(d);
    });

    function pad(n) { return String(n + 1).padStart(2, '0'); }

    function updateUI() {
      counter.textContent = `${pad(current)} / ${pad(slides.length - 1)}`;
      progressFill.style.width = `${(current / (slides.length - 1)) * 100}%`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === slides.length - 1;
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === current);
      });
    }

    function goTo(next) {
      if (transitioning || next === current) return;
      transitioning = true;

      const allSlides = document.querySelectorAll('.slide');
      const from = allSlides[current];
      const to   = allSlides[next];

      from.classList.add('exit');
      from.classList.remove('active');

      // 方向に応じた初期位置をセット
      to.style.transform = next > current ? 'translateX(60px)' : 'translateX(-60px)';
      to.style.opacity = '0';
      to.classList.add('active');

      to.getBoundingClientRect(); // force reflow
      to.style.transform = '';
      to.style.opacity = '';

      current = next;
      updateUI();

      setTimeout(() => {
        from.classList.remove('exit');
        from.style.transform = '';
        transitioning = false;
      }, 450);
    }

    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));

    // キーボード操作
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });

    updateUI();
  </script>
</body>
</html>
