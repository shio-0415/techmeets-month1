<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f0f0f0;
      --card:     #ffffff;
      --text:     #1a1a1a;
      --sub:      #777;
      --accent:   #2d2d2d;
      --shadow:   0 8px 40px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
      --radius:   20px;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      padding: 2rem;
    }

    /* ── Card ── */
    .card {
      width: 400px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.6s cubic-bezier(.4,0,.2,1) 0.1s forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      margin-bottom: 1.25rem;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--bg);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    /* status dot */
    .avatar-wrap::after {
      content: '';
      position: absolute;
      bottom: 4px; right: 4px;
      width: 14px; height: 14px;
      background: #4ade80;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    /* ── Name ── */
    .name {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 0.3rem;
    }

    .role {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--sub);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.1rem;
    }

    /* ── Divider ── */
    .divider {
      width: 40px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
      margin-bottom: 1.1rem;
    }

    /* ── Comment ── */
    .comment {
      font-size: 0.9rem;
      font-weight: 300;
      color: #444;
      text-align: center;
      line-height: 1.7;
      padding: 0 0.5rem;
      margin-bottom: 1.75rem;
    }

    /* ── Skills ── */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: #f0f0f0;
      color: var(--accent);
      border: 1px solid #e0e0e0;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
      cursor: default;
    }
    .badge:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* ── Links ── */
    .links {
      display: flex;
      gap: 0.75rem;
    }
    .link-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.55rem 1.2rem;
      border-radius: 999px;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .link-btn:hover {
      background: var(--accent);
      color: #fff;
    }
    .link-btn.primary {
      background: var(--accent);
      color: #fff;
    }
    .link-btn.primary:hover {
      background: #444;
      border-color: #444;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrap">
      <img class="avatar"
           src="https://placehold.jp/100x100.png"
           alt="プロフィール画像" />
    </div>

    <h1 class="name">Yamada Taro</h1>
    <p class="role">Frontend Developer</p>

    <div class="divider"></div>

    <p class="comment">
      UI/UXが大好きなフロントエンドエンジニア。<br>
      丁寧なコードと美しいデザインを追求しています。
    </p>

    <div class="skills">
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
      <span class="badge">JavaScript</span>
      <span class="badge">React</span>
      <span class="badge">TypeScript</span>
      <span class="badge">Figma</span>
    </div>

    <div class="links">
      <a class="link-btn" href="#">GitHub</a>
      <a class="link-btn primary" href="#">Contact</a>
    </div>
  </div>

</body>
</html>
